name: ardecon
channels:
  - conda-forge
  - nodefaults   # conda-forge only: mixing in Anaconda's defaults channel can stall the solver
dependencies:
  - python=3.10
  - numpy<2.0.0
  - scipy
  - matplotlib
  - pip
  # to build the deconvolution engine, ER-Decon II (core2_decon), inside the environment
  - c-compiler
  - make
  - fftw
